name: tlib CI

on:
  - push
  - pull_request

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update &> /dev/null
          sudo apt -qqy install cmake build-essential &> /dev/null

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run clang-format check
        id: format_check
        continue-on-error: true
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '19'
          exclude-regex: softfloat-3

      - name: Generate formatting guide
        if: steps.format_check.outcome == 'failure'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          Your code does not conform to the repository's code style rules.

          Please run 'check-format.sh' and fix listed discrepancies.
          EOF
          exit 1

      - name: Build supported cores
        run: ./.github/scripts/build-tlib.sh
